[project]
name = "baja"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "anthropic>=1.5",
  "apscheduler>=3.11",
  "asyncpg>=0.30",
  "boto3>=1.43",
  "cryptography>=45",
  "dramatiq[redis]>=2.2",
  "fastapi>=0.116",
  "fpdf2>=2.8",
  "httpx>=0.28",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "pillow>=12",
  "pydantic[email]>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "redis>=6",
  "sqlalchemy[asyncio]>=2.0.43",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43",
  "fakeredis>=2.30",
  "moto[server]>=5.2",
  "mypy>=1.17",
  "pypdf>=6",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-xdist>=3.8",
  "ruff>=0.12",
  "taskipy>=1.14",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["baja*"]

[tool.taskipy.tasks]
api = { cmd = "uvicorn baja.app:app --reload --host 127.0.0.1 --port 8100", help = "run the API" }
worker = { cmd = "dramatiq --processes 1 --threads 1 --watch baja baja.worker.run", help = "run the background worker" }
scheduler = { cmd = "python -m baja.scheduler", help = "run the clock: recurring charges" }
db_migrate = { cmd = "alembic upgrade head", help = "apply database migrations" }
api_tokens = { cmd = "python -m scripts.api_tokens", help = "issue, list or revoke API tokens: task api_tokens issue <email> <label>" }
send_monthly_reports = { cmd = "python -m scripts.send_monthly_reports", help = "queue last month's reports: task send_monthly_reports [YYYY-MM] [--dry-run]" }
import_legacy = { cmd = "python -m scripts.import_legacy", help = "copy the Laravel database in: task import_legacy <dsn> [--dry-run]" }
test = { cmd = "python -m pytest -n auto", help = "run all tests in parallel" }
lint = { cmd = "ruff format . && ruff check --fix .", help = "format and lint with autofix" }
lint_check = { cmd = "ruff format --check . && ruff check .", help = "check formatting and lint" }
lint_types = { cmd = "mypy baja migrations scripts tests", help = "type check" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "UP", "T20", "PT", "RUF10"]
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
