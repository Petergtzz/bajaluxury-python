{% extends "base.html" %}
{% block title %}Invoice {{ number }}{% endblock %}
{% block content %}
<p style="margin:0 0 16px;font-size:16px;line-height:24px;">Hi {{ recipient }},</p>
<p style="margin:0 0 24px;font-size:16px;line-height:24px;">Attached is invoice <strong>{{ number }}</strong> for your stay at {{ property }}.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin:0 0 24px;background:#f5f5f4;border-radius:8px;">
<tr>
<td style="padding:16px;">
<p style="margin:0;font-size:13px;color:#78716c;">Total</p>
<p style="margin:0;font-size:22px;font-weight:700;">{{ total }} MXN</p>
</td>
<td style="padding:16px;text-align:right;">
<p style="margin:0;font-size:13px;color:#78716c;">Due</p>
<p style="margin:0;font-size:16px;font-weight:600;">{{ due }}</p>
</td>
</tr>
</table>
<p style="margin:0;font-size:14px;line-height:20px;">Saludos,<br>{{ company }}</p>
{% endblock %}
